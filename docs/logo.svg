<!-- The GlassOS logo, drawn on the 96 px grid of the launcher icon (mipmap-xhdpi/ic_launcher.png).
     The source of app/src/main/res/drawable-nodpi/logo.png, the welcome logo, rendered at 480 px
     with any SVG renderer (a browser will do). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080E3C"/>
      <stop offset="1" stop-color="#252163"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="96" height="96" rx="23"/></clipPath>
    <clipPath id="slab"><rect x="14" y="14" width="69" height="69" rx="20.5"/></clipPath>
    <filter id="frost" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <g id="scene">
      <rect width="96" height="96" fill="url(#sky)"/>
      <g fill="#FFFFFF">
        <circle cx="29" cy="2" r="3.6" fill="url(#glow)"/>
        <circle cx="29" cy="2" r="1.4"/>
        <circle cx="13.5" cy="36.5" r="0.7"/>
        <circle cx="6.5" cy="43.5" r="2.6" fill="url(#glow)"/>
        <circle cx="6.5" cy="43.5" r="0.95"/>
        <circle cx="1" cy="48" r="2.2" fill="url(#glow)"/>
        <circle cx="1" cy="48" r="0.85"/>
        <circle cx="22.5" cy="31" r="1.45"/>
        <circle cx="57.6" cy="35.3" r="1.1"/>
        <circle cx="45.6" cy="41.5" r="1.25"/>
        <circle cx="50.4" cy="42.3" r="1.15"/>
        <circle cx="79" cy="28" r="1.04"/>
      </g>
      <path d="M0,64 C8,60.5 14,57.6 22,57.8 C36,58.2 60,68.5 82,77.5 L96,77.5 L96,96 L0,96 Z" fill="#DE8040"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <use xlink:href="#scene"/>
    <g clip-path="url(#slab)">
      <use xlink:href="#scene" filter="url(#frost)"/>
      <rect x="14" y="14" width="69" height="69" fill="#FFFFFF" fill-opacity="0.155"/>
    </g>
    <rect x="15" y="15" width="67" height="67" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.325" stroke-width="2"/>
  </g>
</svg>
